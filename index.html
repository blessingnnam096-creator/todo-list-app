<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>To-Do List</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--text:#1f2328;--muted:#7a7f87;--accent:#2f6fed;--line:#e6e4dd;--danger:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--card:#20242a;--text:#e8eaed;--muted:#8b919a;--accent:#6b9bff;--line:#2d323a;--danger:#ff7676}}
:root[data-theme="dark"]{--bg:#16181c;--card:#20242a;--text:#e8eaed;--muted:#8b919a;--accent:#6b9bff;--line:#2d323a;--danger:#ff7676}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
.add{display:flex;gap:8px;margin-bottom:16px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font-size:16px}
input[type=text]:focus{outline:2px solid var(--accent);border-color:transparent}
button{font:inherit;cursor:pointer}
.btn{padding:0 18px;border:0;border-radius:10px;background:var(--accent);color:#fff;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--muted);font-size:14px}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
ul{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li input{width:20px;height:20px;accent-color:var(--accent);flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--muted)}
.del{border:0;background:none;color:var(--muted);font-size:20px;line-height:1}
.del:hover{color:var(--danger)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:14px}
.link{border:0;background:none;color:var(--accent);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>To-Do List</h1>
  <p class="sub" id="count"></p>
  <div class="add">
    <input type="text" id="in" placeholder="Add a task…" maxlength="200">
    <button class="btn" id="addBtn">Add</button>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-f="all">All</button>
    <button class="tab" data-f="active">Active</button>
    <button class="tab" data-f="done">Done</button>
  </div>
  <ul id="list"></ul>
  <div class="foot"><span></span><button class="link" id="clear">Clear completed</button></div>
</main>
<script>
var tasks=[],filter="all",KEY="todo-tasks";
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
function render(){
  var list=document.getElementById("list");list.innerHTML="";
  var shown=tasks.filter(function(t){return filter==="all"||(filter==="done")===t.done});
  if(!shown.length){list.innerHTML='<div class="empty">Nothing here yet.</div>'}
  shown.forEach(function(t){
    var li=document.createElement("li");if(t.done)li.className="done";
    var cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;
    cb.onchange=function(){t.done=cb.checked;save();render()};
    var sp=document.createElement("span");sp.textContent=t.text;
    var d=document.createElement("button");d.className="del";d.textContent="×";d.setAttribute("aria-label","Delete");
    d.onclick=function(){tasks=tasks.filter(function(x){return x!==t});save();render()};
    li.append(cb,sp,d);list.appendChild(li);
  });
  var left=tasks.filter(function(t){return!t.done}).length;
  document.getElementById("count").textContent=left+" task"+(left===1?"":"s")+" remaining";
}
function add(){
  var i=document.getElementById("in"),v=i.value.trim();
  if(!v)return;tasks.unshift({text:v,done:false});i.value="";save();render();i.focus();
}
document.getElementById("addBtn").onclick=add;
document.getElementById("in").addEventListener("keydown",function(e){if(e.key==="Enter")add()});
document.getElementById("tabs").onclick=function(e){
  var f=e.target.dataset.f;if(!f)return;filter=f;
  document.querySelectorAll(".tab").forEach(function(b){b.classList.toggle("on",b.dataset.f===f)});render();
};
document.getElementById("clear").onclick=function(){tasks=tasks.filter(function(t){return!t.done});save();render()};
render();
</script>
</body>
</html>
